name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(ls Monster_Collector*.zip | head -n 1)
          unzip -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Compilar el mod
        working-directory: monster_collector
        run: gradle build

      - name: Comprobar el catálogo
        working-directory: monster_collector
        run: |
          javac -d build/catalog-check $(find src/main/java/com/monstercollector/domain -name "*.java") src/test/java/com/monstercollector/CatalogCheck.java
          java -cp build/catalog-check com.monstercollector.CatalogCheck

      - uses: actions/upload-artifact@v4
        with:
          name: monster-collector
          path: monster_collector/build/libs/*.jar
